name: CI

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Lint Python sources
        run: python -m ruff check .

      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Verify release build excludes AGPL model
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          python build.py --release
          if ($LASTEXITCODE -ne 0) {
            throw "Release build failed with exit code $LASTEXITCODE"
          }
          Write-Host "Release build succeeded: AGPL model correctly excluded"

      - name: Build Windows release bundle
        if: matrix.python-version == '3.12'
        run: python build.py --development

      - name: Verify packaged bundle
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $expected = python -c "import sys; sys.path.insert(0, 'app'); from version import __version__; print(__version__)"
          $exe = Get-Item -LiteralPath dist\AirControl\AirControl.exe
          if ($exe.VersionInfo.FileVersion -ne $expected) {
            throw "Unexpected FileVersion: $($exe.VersionInfo.FileVersion)"
          }
          if ($exe.VersionInfo.ProductVersion -ne $expected) {
            throw "Unexpected ProductVersion: $($exe.VersionInfo.ProductVersion)"
          }
          $env:AIRCONTROL_DATA_DIR = Join-Path $env:RUNNER_TEMP 'AirControl-smoke'
          New-Item -ItemType Directory -Force -Path $env:AIRCONTROL_DATA_DIR | Out-Null
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -WorkingDirectory $exe.DirectoryName -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged self-test failed with exit code $($process.ExitCode)"
          }
